[package]
name = "chat-room"
version = "0.1.0"
edition = "2021"
description = "单文件部署的私密聊天室"
license = "MIT"
publish = false
rust-version = "1.87"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "macros", "multipart", "ws"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
kamadak-exif = "0.6"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jpeg-decoder = "0.3"
mime_guess = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
